name: Commit policy

on:
  push:
  pull_request:

jobs:
  no-ai-authorship:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisar los mensajes de commit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            rango="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            rango="HEAD"
          else
            rango="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "Revisando: $rango"

          patron='Co-authored-by:.*(claude|copilot|chatgpt|openai|anthropic|gemini|cursor|codeium|devin|tabnine)|Generated with.*(Claude|Copilot|ChatGPT)'

          encontrados=$(git log --format='%H%n%B%n---' "$rango" | grep -iE "$patron" || true)

          if [ -n "$encontrados" ]; then
            echo "::error::Hay commits que atribuyen autoria a herramientas de IA"
            echo "$encontrados"
            exit 1
          fi

          echo "Sin atribuciones a herramientas de IA."
